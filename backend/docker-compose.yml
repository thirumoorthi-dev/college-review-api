version: '3.8'

services:
  api:
    build: .
    container_name: college_review_api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/college_review_db
      - JWT_SECRET=${JWT_SECRET:-supersecret_jwt_key_college_review_system_2026_production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=*
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: college_review_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
